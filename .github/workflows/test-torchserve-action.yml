name: Test TorchServe Setup Action
# Dummy change to trigger CI - test run

on:
  push:
    branches:
      - highlighting-processor-remote-model
    paths:
      - '.github/actions/setup-torchserve/**'
      - '.github/workflows/test-torchserve-action.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/actions/setup-torchserve/**'
      - '.github/workflows/test-torchserve-action.yml'
  workflow_dispatch:

jobs:
  test-torchserve-setup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Start TorchServe container
        run: |
          echo "Starting TorchServe container..."
          docker run -d \
            --name torchserve \
            -p 8080:8080 \
            -p 8081:8081 \
            pytorch/torchserve:0.11.0-cpu \
            torchserve --start --model-store /home/model-server/model-store --ts-config /home/model-server/config.properties
          
          # Give container time to start
          sleep 10
          
          echo "Container status:"
          docker ps
          
          echo ""
          echo "=== Initial Resource Usage (Container Started) ==="
          docker stats torchserve --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
      
      - name: Setup TorchServe Model
        uses: ./.github/actions/setup-torchserve
        with:
          python-version: '3.9'
          torchserve-endpoint: 'http://localhost:8080'
      
      - name: Verify Model Deployment
        run: |
          echo "Checking models loaded in TorchServe..."
          curl -s http://localhost:8081/models | jq .
          
          echo ""
          echo "=== Resource Usage After Model Loading ==="
          docker stats torchserve --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}"
          
          # Check disk usage inside container
          echo ""
          echo "=== Disk Usage in Container ==="
          docker exec torchserve df -h /home/model-server
          
          # Check model file sizes
          echo ""
          echo "=== Model Files Size ==="
          docker exec torchserve ls -lh /home/model-server/model-store/
          
          echo ""
          echo "========================================="
          echo "Testing SINGLE document inference..."
          echo "========================================="
          
          # Monitor resources during inference
          echo "Resources before single inference:"
          docker stats torchserve --no-stream --format "CPU: {{.CPUPerc}} | Memory: {{.MemUsage}} ({{.MemPerc}})"
          
          SINGLE_RESPONSE=$(curl -s -X POST http://localhost:8080/predictions/semantic_highlighter \
            -H "Content-Type: application/json" \
            -d '{
              "question": "What is batch processing?",
              "context": "Batch processing is a method of running high-volume, repetitive data jobs. The method allows users to process data when computing resources are available."
            }')
          
          echo "Resources after single inference:"
          docker stats torchserve --no-stream --format "CPU: {{.CPUPerc}} | Memory: {{.MemUsage}} ({{.MemPerc}})"
          
          echo "Single document response:"
          echo "$SINGLE_RESPONSE" | jq .
          
          # Check if response contains expected fields
          if echo "$SINGLE_RESPONSE" | grep -q "highlights"; then
            echo "✓ Single document inference successful!"
          else
            echo "✗ Single document inference failed!"
            echo "Container logs:"
            docker logs torchserve --tail 50
            exit 1
          fi
          
          echo ""
          echo "========================================="
          echo "Testing BATCH inference (multiple docs)..."
          echo "========================================="
          
          echo "Resources before batch inference:"
          docker stats torchserve --no-stream --format "CPU: {{.CPUPerc}} | Memory: {{.MemUsage}} ({{.MemPerc}})"
          
          BATCH_RESPONSE=$(curl -s -X POST http://localhost:8080/predictions/semantic_highlighter \
            -H "Content-Type: application/json" \
            -d '{
              "inputs": [
                {
                  "question": "What is OpenSearch?",
                  "context": "OpenSearch is a scalable, flexible, and extensible open-source software suite for search, analytics, and observability applications."
                },
                {
                  "question": "What is machine learning?",
                  "context": "Machine learning is a branch of artificial intelligence that focuses on the use of data and algorithms to imitate human learning."
                }
              ]
            }')
          
          echo "Resources after batch inference:"
          docker stats torchserve --no-stream --format "CPU: {{.CPUPerc}} | Memory: {{.MemUsage}} ({{.MemPerc}})"
          
          echo "Batch inference response:"
          echo "$BATCH_RESPONSE" | jq .
          
          # Check if batch response has highlights array with 2 results
          if echo "$BATCH_RESPONSE" | jq -e '.highlights | length == 2' > /dev/null 2>&1; then
            echo "✓ Batch inference successful! Processed 2 documents."
          else
            echo "✗ Batch inference failed!"
            echo "Container logs:"
            docker logs torchserve --tail 50
            exit 1
          fi
          
          echo ""
          echo "========================================="
          echo "✓ ALL TESTS PASSED!"
          echo "========================================="
          
          echo ""
          echo "=== Final Resource Summary ==="
          docker stats torchserve --no-stream --format "table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}\t{{.NetIO}}\t{{.BlockIO}}"
          
          # Get detailed memory breakdown
          echo ""
          echo "=== Detailed Memory Info ==="
          docker exec torchserve cat /proc/meminfo | grep -E "MemTotal|MemFree|MemAvailable|Cached"
      
      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== TorchServe Container Logs ==="
          docker logs torchserve --tail 100